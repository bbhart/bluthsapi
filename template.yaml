AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Bluths API - Arrested Development Quotes API
  Serverless API deployed to AWS Lambda with rate limiting

  NOTE: Custom domain (api.lucille2.com) requires an ACM certificate ARN.
  To enable the custom domain, provide the CertificateArn parameter during deployment.
  The certificate MUST be in us-east-1 region and include api.lucille2.com as a domain name.

# Global configuration applied to all functions
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.13
    Architectures:
      - x86_64
    Environment:
      Variables:
        # S3_BASE_URL from existing config - will be passed via parameter or environment
        S3_BASE_URL: !Ref S3BaseUrl

Parameters:
  S3BaseUrl:
    Type: String
    Description: Base URL for media files on S3
    Default: "https://bqaasmedia.s3.us-east-1.amazonaws.com"

  PerIPRateLimit:
    Type: Number
    Description: Requests per second per IP address
    Default: 1
    MinValue: 1
    MaxValue: 100

  GlobalRateLimit:
    Type: Number
    Description: Total requests per second across all IPs
    Default: 10
    MinValue: 1
    MaxValue: 10000

  CustomDomainName:
    Type: String
    Description: Custom domain name for the API (e.g., api.lucille2.com)
    Default: "api.lucille2.com"

  CertificateArn:
    Type: String
    Description: ACM Certificate ARN for the custom domain (must be in us-east-1)
    Default: ""

  AlertEmail:
    Type: String
    Description: >-
      Address that receives budget warnings and the shutdown notice. Required:
      it is deliberately not defaulted so that a deployment never sends this
      stack's cost alerts to somebody else's inbox.
    AllowedPattern: ".+@.+\\..+"
    ConstraintDescription: Must be a valid email address.

Resources:
  # Lambda function for the FastAPI application
  BluthsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Description: Bluths API - Arrested Development quotes with rate limiting
      CodeUri: .  # Points to repository root (includes app/ directory)
      Handler: app.main.handler  # Mangum handler in app/main.py

      # Performance configuration
      MemorySize: 512  # Balance of cost and performance
      Timeout: 30
      ReservedConcurrentExecutions: 3  # Limits max concurrent instances (cost control)

      # Auto-publish Lambda versions for rollback capability
      AutoPublishAlias: live

      # Environment variables passed to Lambda
      Environment:
        Variables:
          S3_BASE_URL: !Ref S3BaseUrl
          RATE_LIMIT_PER_IP: !Ref PerIPRateLimit
          # Global rate limit enforced by API Gateway, not Lambda

      # API Gateway HTTP API event source
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BluthsHttpApi
            Path: /{proxy+}
            Method: ANY

      # IAM role for Lambda execution
      Role: !GetAtt BluthsApiFunctionRole.Arn

      # CloudWatch Logs configuration
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref BluthsApiFunctionLogGroup

  # Separate Log Group for better control over retention
  BluthsApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 7  # Keep logs for 7 days to minimize costs

  # IAM role for Lambda execution
  BluthsApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Basic Lambda execution permissions (CloudWatch Logs)
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      # Add additional policies here if Lambda needs to access other AWS services
      # For example, if media files need to be served from S3 directly by Lambda

  # Budget Shutdown Lambda Function
  BudgetShutdownFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-budget-shutdown'
      Description: Disables API Gateway when budget limit is reached
      CodeUri: .
      Handler: app.budget_shutdown.handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt BudgetShutdownFunctionRole.Arn
      AutoPublishAlias: live
      Environment:
        Variables:
          API_GATEWAY_ID: !Ref BluthsHttpApi

  # IAM role for Budget Shutdown Lambda
  BudgetShutdownFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-budget-shutdown-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiGatewayThrottleControl
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:PATCH
                Resource: !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/${BluthsHttpApi}/stages/prod'

  # ===========================================================================
  # Budget & Alerting (feature 010-budget-cloudformation)
  # ---------------------------------------------------------------------------
  # SNS topic fans out budget notifications + CloudWatch-alarm notifications.
  # Topic policy grants publish to both `budgets.amazonaws.com` and
  # `cloudwatch.amazonaws.com`, each scoped via aws:SourceAccount.
  # ===========================================================================

  BudgetAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: bluths-api-budget-alerts
      DisplayName: Bluths API Budget Alerts

  BudgetAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BudgetAlertsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBudgetsToPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BudgetAlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowCloudWatchAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BudgetAlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  BudgetAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BudgetAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Monthly cost budget — limit $30. Notifications at $20 (warning) and
  # $30 (paired with the Lambda budget action below).
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: bluths-api-cost-budget
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 30
          Unit: USD
      # AWS Budgets allows at most 1 SNS-type subscriber per notification (but
      # multiple EMAIL-type subscribers). Email is delivered directly via the
      # EMAIL subscriber; SNS subscription on the $30 notification is reserved
      # for the Lambda trigger only.
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 20.0
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 30.0
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
            - SubscriptionType: SNS
              Address: !Ref BudgetShutdownTriggerTopic

  # Shutdown-trigger SNS topic — the $30 budget notification publishes here,
  # which fans out to the shutdown Lambda via the subscription below.
  # AWS::Budgets::BudgetsAction does NOT support Lambda targets in CloudFormation
  # (only APPLY_IAM_POLICY, APPLY_SCP_POLICY, RUN_SSM_DOCUMENTS); SNS is the
  # canonical bridge. Kept on its own topic — separate from BudgetAlertsTopic —
  # so $20 notifications (which publish only to the alerts topic) do not
  # invoke the shutdown Lambda.
  BudgetShutdownTriggerTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: bluths-api-budget-shutdown-trigger
      DisplayName: Bluths API Budget Shutdown Trigger

  BudgetShutdownTriggerTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BudgetShutdownTriggerTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBudgetsToPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BudgetShutdownTriggerTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # SNS subscription — Lambda target. Endpoint is the `:live` alias so
  # AutoPublishAlias rollback applies. DependsOn the SAM-generated alias
  # resource (SAM creates AWS::Lambda::Alias with logical ID
  # <FunctionLogicalId>Aliaslive); !Sub doesn't infer the dependency.
  BudgetShutdownSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: BudgetShutdownFunctionAliaslive
    Properties:
      TopicArn: !Ref BudgetShutdownTriggerTopic
      Protocol: lambda
      Endpoint: !Sub '${BudgetShutdownFunction.Arn}:live'

  # Permits SNS to invoke the Lambda alias.
  BudgetShutdownInvokePermission:
    Type: AWS::Lambda::Permission
    DependsOn: BudgetShutdownFunctionAliaslive
    Properties:
      FunctionName: !Sub '${BudgetShutdownFunction.Arn}:live'
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref BudgetShutdownTriggerTopic

  # CloudWatch Alarm — fires if the shutdown Lambda errors when invoked.
  # FR-012: visibility on silent kill-switch failure.
  BudgetShutdownErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: bluths-api-budget-shutdown-errors
      AlarmDescription: Fires if the bluths-api-budget-shutdown Lambda errors when AWS Budgets invokes it.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BudgetShutdownFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BudgetAlertsTopic

  # Read-only role for the month-rollover check Lambda (FR-014).
  # No PATCH / Update / Delete — only GET and SNS publish.
  MonthRolloverCheckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bluths-api-month-rollover-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadOnlyApiAndPublishSns
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: apigateway:GET
                Resource: !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/${BluthsHttpApi}/stages/prod'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref BudgetAlertsTopic

  # Month-rollover check Lambda — read-only, monthly safety net (FR-013).
  MonthRolloverCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bluths-api-month-rollover-check
      Description: Reads prod stage throttle; emails the operator if API is still disabled at start of month.
      CodeUri: .
      Handler: app.month_rollover_check.handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt MonthRolloverCheckRole.Arn
      AutoPublishAlias: live
      Environment:
        Variables:
          API_GATEWAY_ID: !Ref BluthsHttpApi
          SNS_TOPIC_ARN: !Ref BudgetAlertsTopic

  # EventBridge schedule — fires the rollover check at 00:05 UTC on the 1st.
  MonthRolloverSchedule:
    Type: AWS::Events::Rule
    DependsOn: MonthRolloverCheckFunctionAliaslive
    Properties:
      Name: bluths-api-month-rollover-schedule
      Description: Triggers month-rollover check at 00:05 UTC on the 1st of each month.
      ScheduleExpression: 'cron(5 0 1 * ? *)'
      State: ENABLED
      Targets:
        - Id: MonthRolloverCheckLambda
          Arn: !Sub '${MonthRolloverCheckFunction.Arn}:live'

  MonthRolloverSchedulePermission:
    Type: AWS::Lambda::Permission
    DependsOn: MonthRolloverCheckFunctionAliaslive
    Properties:
      FunctionName: !Sub '${MonthRolloverCheckFunction.Arn}:live'
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthRolloverSchedule.Arn

  # HTTP API (API Gateway v2)
  BluthsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Description: Bluths API - HTTP API with rate limiting

      # CORS configuration (FR-016 - allow all origins)
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - "*"
        AllowCredentials: false

      # Default route settings (apply to all routes)
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref GlobalRateLimit
        ThrottlingRateLimit: !Ref GlobalRateLimit

      # Access logging to CloudWatch
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '$context.requestId $context.error.message $context.error.messageString $context.integration.error $context.integration.integrationStatus $context.integration.latency $context.integration.requestId $context.integration.status $context.path $context.requestTime $context.responseLength $context.status'

  # Log group for API Gateway access logs
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-http-api'
      RetentionInDays: 7

  # Custom domain name for API Gateway
  ApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCertificate
    Properties:
      DomainName: !Ref CustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  # Map custom domain to API
  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCertificate
    Properties:
      DomainName: !Ref ApiCustomDomain
      ApiId: !Ref BluthsHttpApi
      Stage: prod

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]

Outputs:
  # API Gateway endpoint URL
  ApiUrl:
    Description: "API Gateway endpoint URL (prod stage)"
    Value: !Sub "https://${BluthsHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub '${AWS::StackName}-api-url'

  # Lambda function ARN
  FunctionArn:
    Description: "Lambda function ARN"
    Value: !GetAtt BluthsApiFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-function-arn'

  # Lambda function name
  FunctionName:
    Description: "Lambda function name"
    Value: !Ref BluthsApiFunction
    Export:
      Name: !Sub '${AWS::StackName}-function-name'

  # API Gateway ID
  ApiId:
    Description: "API Gateway HTTP API ID"
    Value: !Ref BluthsHttpApi
    Export:
      Name: !Sub '${AWS::StackName}-api-id'

  # Rate limit configuration
  PerIPLimit:
    Description: "Requests per second per IP address"
    Value: !Ref PerIPRateLimit

  GlobalLimit:
    Description: "Total requests per second (all IPs)"
    Value: !Ref GlobalRateLimit

  CustomDomainUrl:
    Description: "Custom domain URL (if certificate provided)"
    Value: !If
      - HasCertificate
      - !Sub "https://${CustomDomainName}"
      - "No certificate provided - custom domain not configured"

  CustomDomainTarget:
    Description: "Regional domain to point CNAME to (if certificate provided)"
    Value: !If
      - HasCertificate
      - !GetAtt ApiCustomDomain.RegionalDomainName
      - "No certificate provided - custom domain not configured"

  BudgetShutdownFunctionArn:
    Description: "Budget shutdown Lambda function ARN (for AWS Budget Actions)"
    Value: !GetAtt BudgetShutdownFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-budget-shutdown-arn'

  BudgetAlertsTopicArn:
    Description: "SNS topic that fans out budget + alarm notifications"
    Value: !Ref BudgetAlertsTopic
    Export:
      Name: !Sub '${AWS::StackName}-budget-alerts-topic-arn'

  MonthlyBudgetName:
    Description: "AWS Budget name for the monthly cost cap"
    Value: !Ref MonthlyBudget
    Export:
      Name: !Sub '${AWS::StackName}-monthly-budget-name'

  MonthRolloverCheckFunctionArn:
    Description: "Month-rollover check Lambda ARN (for manual invocation testing)"
    Value: !GetAtt MonthRolloverCheckFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-month-rollover-check-arn'

# Metadata for SAM CLI / AWS Serverless Application Repository
Metadata:
  AWS::ServerlessRepo::Application:
    Name: bluths-api
    Description: Arrested Development quotes API
    Author: Brian Hart
    SemanticVersion: 1.0.0
    LicenseUrl: LICENSE
    ReadmeUrl: README.md
