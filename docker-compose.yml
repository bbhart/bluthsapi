
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - S3_BASE_URL=${S3_BASE_URL:-https://example-bucket.s3.amazonaws.com}
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    volumes:
      # Mount code for hot-reload during development (optional)
      - ./app:/app/app:ro
      - ./public:/app/public:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
