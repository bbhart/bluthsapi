name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  quotes-data:
    name: Quotes data (speaker names)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Fails if a quote names a character that is not in
      # app/data/list-of-characters.txt, or if that file is out of sync.
      - name: Check canonical speaker names
        run: python scripts/normalize_speakers.py --check

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run API tests
        run: pytest tests/api -v --tb=short

  e2e-tests:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run e2e tests
        run: pytest tests/e2e -v --tb=short
