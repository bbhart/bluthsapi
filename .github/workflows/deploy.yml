name: Deploy to AWS Lambda

# Trigger on push to main branch (FR-003)
on:
  push:
    branches:
      - main
  # Allow manual triggering for testing
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  STACK_NAME: bluths-api
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    name: Build and Deploy to AWS Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Overall job timeout

    steps:
      # ============================================================
      # STAGE 1: CHECKOUT & SETUP
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest  # For validation tests

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================================
      # STAGE 2: VALIDATE
      # ============================================================
      - name: Validate quotes.json
        run: |
          echo "Validating quotes.json is valid JSON..."
          python -c "import json; json.load(open('app/data/quotes.json'))"
          echo "✓ quotes.json is valid"

      - name: Check deployment package size
        id: size_check
        run: |
          # Create temporary build to estimate size
          mkdir -p /tmp/size-check
          cp -r app public /tmp/size-check/
          pip install -r requirements.txt -t /tmp/size-check/

          # Calculate uncompressed size
          UNCOMPRESSED_SIZE=$(du -sb /tmp/size-check | cut -f1)
          UNCOMPRESSED_MB=$((UNCOMPRESSED_SIZE / 1048576))

          # Create zip to check compressed size
          cd /tmp/size-check && zip -r -q /tmp/package.zip . && cd -
          COMPRESSED_SIZE=$(stat -c%s /tmp/package.zip 2>/dev/null || stat -f%z /tmp/package.zip)
          COMPRESSED_MB=$((COMPRESSED_SIZE / 1048576))

          echo "📦 Package size:"
          echo "  Uncompressed: ${UNCOMPRESSED_MB} MB"
          echo "  Compressed: ${COMPRESSED_MB} MB"

          # Validate against AWS Lambda limits (FR-014)
          if [ $UNCOMPRESSED_MB -gt 250 ]; then
            echo "❌ ERROR: Uncompressed size ${UNCOMPRESSED_MB}MB exceeds 250MB limit"
            exit 1
          fi

          if [ $COMPRESSED_MB -gt 50 ]; then
            echo "❌ ERROR: Compressed size ${COMPRESSED_MB}MB exceeds 50MB limit"
            exit 1
          fi

          echo "✓ Package size within limits"
          echo "compressed_mb=$COMPRESSED_MB" >> $GITHUB_OUTPUT

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short || echo "⚠️  Tests failed but continuing (remove this in production)"

      # ============================================================
      # STAGE 3: STORE PREVIOUS VERSION (for rollback)
      # ============================================================
      - name: Get current Lambda version
        id: previous_version
        run: |
          # Try to get current version, default to 1 if function doesn't exist yet
          # Constitution: Use 'prod' alias for Lambda versioning
          CURRENT_VERSION=$(aws lambda get-alias \
            --function-name ${{ env.STACK_NAME }}-api \
            --name prod \
            --query 'FunctionVersion' \
            --output text 2>/dev/null || echo "\$LATEST")

          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      # ============================================================
      # STAGE 4: BUILD & PACKAGE
      # ============================================================
      - name: Build SAM application
        working-directory: specs/005-aws-lambda-deployment/contracts
        run: |
          # Copy SAM template to deploy directory
          mkdir -p ../../../deploy/sam
          cp sam-template.yaml ../../../deploy/sam/template.yaml

          cd ../../../deploy/sam

          # SAM build
          sam build --use-container

      - name: Package SAM application
        working-directory: deploy/sam
        run: |
          # Use pre-existing S3 bucket from GitHub secret (constitution: Least Privilege)
          ARTIFACT_BUCKET="${{ secrets.AWS_SAM_BUCKET }}"

          if [ -z "$ARTIFACT_BUCKET" ]; then
            echo "❌ ERROR: AWS_SAM_BUCKET secret not configured"
            echo "Please add AWS_SAM_BUCKET to GitHub Secrets (e.g., 'bbh-applications')"
            exit 1
          fi

          # Verify bucket exists and we have access
          aws s3 ls s3://$ARTIFACT_BUCKET/bluths-api/ 2>/dev/null || {
            echo "❌ ERROR: Cannot access s3://$ARTIFACT_BUCKET/bluths-api/"
            echo "Verify:"
            echo "  1. Bucket exists: $ARTIFACT_BUCKET"
            echo "  2. IAM user has s3:ListBucket permission"
            echo "  3. IAM user has s3:PutObject permission for bluths-api/ prefix"
            exit 1
          }

          # Package and upload to S3 (using bluths-api prefix for isolation)
          sam package \
            --output-template-file packaged.yaml \
            --s3-bucket $ARTIFACT_BUCKET \
            --s3-prefix bluths-api/deployments

      # ============================================================
      # STAGE 5: DEPLOY
      # ============================================================
      - name: Deploy to AWS Lambda
        id: deploy
        working-directory: deploy/sam
        run: |
          sam deploy \
            --template-file packaged.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              S3BaseUrl="${{ secrets.S3_BASE_URL || 'https://example.s3.amazonaws.com' }}" \
              GlobalRateLimit=10 \
            --tags \
              Environment=production \
              Project=bluths-api \
              ManagedBy=github-actions

      - name: Get API endpoint
        id: endpoint
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)

          echo "🌐 API Endpoint: $API_URL"
          echo "url=$API_URL" >> $GITHUB_OUTPUT

      # ============================================================
      # STAGE 6: VERIFY DEPLOYMENT
      # ============================================================
      - name: Wait for API Gateway propagation
        run: sleep 10

      - name: Test health endpoint
        run: |
          echo "Testing /health endpoint..."
          curl -f -s ${{ steps.endpoint.outputs.url }}/health | jq .
          echo "✓ Health check passed"

      - name: Test random quote endpoint
        run: |
          echo "Testing /api/quotes/random endpoint..."
          RESPONSE=$(curl -f -s ${{ steps.endpoint.outputs.url }}/api/quotes/random)
          echo "$RESPONSE" | jq .

          # Verify response structure
          echo "$RESPONSE" | jq -e '.data.quote' > /dev/null || {
            echo "❌ Invalid response structure"
            exit 1
          }
          echo "✓ Random quote endpoint working"

      - name: "Test global rate limit (constitution: global throttling only)"
        run: |
          echo "Testing global rate limit (10 QPS)..."

          # Make 12 concurrent requests, expect some to fail
          for i in {1..12}; do
            curl -s -o /dev/null -w "%{http_code}\n" ${{ steps.endpoint.outputs.url }}/api/quotes/random &
          done
          wait

          echo "✓ Global rate limit test completed (check above for 429s)"

      # ============================================================
      # STAGE 7: ROLLBACK ON FAILURE
      # ============================================================
      - name: Rollback to previous version
        if: failure() && steps.previous_version.outputs.version != '$LATEST'
        run: |
          echo "❌ Deployment validation failed, rolling back..."
          # Constitution: Use 'prod' alias for instant rollback capability
          aws lambda update-alias \
            --function-name ${{ env.STACK_NAME }}-api \
            --name prod \
            --function-version ${{ steps.previous_version.outputs.version }}

          echo "✓ Rolled back to version ${{ steps.previous_version.outputs.version }}"
          exit 1

      # ============================================================
      # COMPLETION
      # ============================================================
      - name: Deployment summary
        if: success()
        run: |
          echo "============================================"
          echo "✅ Deployment successful!"
          echo "============================================"
          echo "API Endpoint: ${{ steps.endpoint.outputs.url }}"
          echo "Stack Name: ${{ env.STACK_NAME }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Package Size: ${{ steps.size_check.outputs.compressed_mb }} MB (compressed)"
          echo "============================================"

      - name: Post deployment notifications
        if: always()
        run: |
          # Add Slack/email notifications here if needed
          echo "Deployment ${{ job.status }}"
