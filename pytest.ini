[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Playwright configuration
# Default to headless mode for CI/automation
# Use --headed flag to see browser: pytest tests/ --headed

# Output configuration
addopts = -v --tb=short

# Note: pytest-timeout plugin not installed by default
# Individual test timeouts managed via playwright's default timeout
